[project]
name = "mf2wxr"
version = "0.1.0"
description = "Push MacroFactor workouts to your weightxreps.net journal"
readme = "README.md"
license = "MIT"
authors = [{ name = "Jasper Vandemalle" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
clipboard = ["pyperclip>=1.9"]

[project.scripts]
mf2wxr = "mf2wxr.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
